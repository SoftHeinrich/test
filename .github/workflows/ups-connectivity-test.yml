name: UPS connectivity test

on:
  push:
    paths:
      - '.github/workflows/ups-connectivity-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Test UPS public tracking with headless Chrome
        shell: bash
        run: |
          set +e
          URL='https://www.ups.com/track?loc=en_DE&tracknum=1Z2EB7356826735511'
          echo '--- Chrome version ---'
          google-chrome --version || chromium-browser --version || chromium --version || true
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          echo "chrome=$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu \
            --disable-dev-shm-usage --window-size=1440,1200 \
            --virtual-time-budget=20000 --dump-dom "$URL" \
            > ups-browser.html 2>chrome.log
          rc=$?
          echo "chrome_exit=$rc"
          echo '--- browser matches ---'
          grep -niE 'Access Denied|1Z2EB7356826735511|Label Created|Shipper created|UPS has not received|On the Way|In Transit|Delivered|France|Germany|tracking' ups-browser.html | head -160 || true
          echo '--- body size ---'
          wc -c ups-browser.html || true
          echo '--- chrome log tail ---'
          tail -80 chrome.log || true
          exit 0
