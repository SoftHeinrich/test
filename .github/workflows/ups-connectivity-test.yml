name: UPS connectivity test

on:
  push:
    paths:
      - '.github/workflows/ups-connectivity-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test legacy UPS WebTracking endpoint
        shell: bash
        run: |
          set +e
          URL='https://wwwapps.ups.com/WebTracking/track?track=yes&trackNums=1Z2EB7356826735511'
          curl -L -sS --connect-timeout 15 --max-time 45 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            -D headers.txt "$URL" -o body.html
          echo '--- headers ---'
          head -80 headers.txt || true
          echo '--- matches ---'
          grep -niE 'Access Denied|1Z2EB7356826735511|Label Created|Shipper created|UPS has not received|On the Way|In Transit|Delivered|France|Germany|tracking|status' body.html | head -160 || true
          echo '--- size ---'
          wc -c body.html || true
          exit 0
