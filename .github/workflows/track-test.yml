name: SanSee shipment tracker

on:
  schedule:
    - cron: '55 7,19 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'tracker.py'
      - '.github/workflows/track-test.yml'

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Query San See and build tracking.json
        run: python3 tracker.py

      - name: Show latest event
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('tracking.json', encoding='utf-8'))
          print('tracking_number:', d['tracking_number'])
          print('latest_time:', d['latest_time'])
          print('current_status:', d['current_status'])
          print('latest_event:', d['latest_event'])
          print('changed_since_previous_fetch:', d['changed_since_previous_fetch'])
          print('event_count:', len(d['events']))
          PY

      - name: Commit updated tracking data
        shell: bash
        run: |
          if git diff --quiet -- tracking.json && git ls-files --error-unmatch tracking.json >/dev/null 2>&1; then
            echo 'No tracking change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tracking.json
          git commit -m 'Update shipment tracking data'
          git push
