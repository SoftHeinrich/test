name: 17TRACK UPS connectivity test

on:
  push:
    paths:
      - '.github/workflows/17track-connectivity-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect 17TRACK free widget transport
        shell: bash
        run: |
          set +e
          curl -L -sS --connect-timeout 15 --max-time 45 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            'https://www.17track.net/externalcall.js' -o externalcall.js
          echo '--- js size ---'
          wc -c externalcall.js || true
          echo '--- contexts ---'
          grep -niE 'trackSingle|YQ_Fc|iframe|YQ_Num|carrier|externalcall|17track' externalcall.js | head -400 || true
          echo '--- urls/domains ---'
          strings externalcall.js | grep -Ei '17track|iframe|track|external' | head -400 || true
          exit 0
