name: 17TRACK UPS connectivity test

on:
  push:
    paths:
      - '.github/workflows/17track-connectivity-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Render 17TRACK free UPS widget result
        shell: bash
        run: |
          set +e
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          URL='https://extcall.17track.net/en/track?utm_medium=Referral&utm_source=github#apitype=1&uheight=800&nums=1Z2EB7356826735511&fc=100002&sc=0&iframeId=test&rmad=false&rmh=false'
          echo "$URL"
          timeout 45s "$CHROME" --headless=new --no-sandbox --disable-gpu \
            --disable-dev-shm-usage --window-size=1440,1400 \
            --virtual-time-budget=20000 --dump-dom "$URL" \
            > result.html 2>chrome.log
          rc=$?
          echo "chrome_exit=$rc"
          echo '--- matches ---'
          grep -niE '1Z2EB7356826735511|UPS|Label Created|Shipper created|On the Way|In Transit|Delivered|France|Germany|Not Found|Unknown|Pending|Info Received|tracking|status|2026-' result.html | head -300 || true
          echo '--- size ---'
          wc -c result.html || true
          echo '--- log tail ---'
          tail -60 chrome.log || true
          exit 0
